name: CD - Google Cloud Run

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pechetech-repo/pechetech-predictive-weather-service:latest
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pechetech-repo/pechetech-predictive-weather-service:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pechetech-predictive-weather-service
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pechetech-repo/pechetech-predictive-weather-service:latest
          region: ${{ secrets.GCP_REGION }}
          flags: '--allow-unauthenticated'

